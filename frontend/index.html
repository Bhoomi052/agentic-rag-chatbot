<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 680px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1rem;
      color: #a78bfa;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-area {
      border: 2px dashed #3b3b5c;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-area:hover { border-color: #7c3aed; }

    .upload-area input { display: none; }

    .upload-area p { color: #6b7280; font-size: 0.9rem; margin-top: 8px; }

    .upload-area .icon { font-size: 2.5rem; }

    #file-name {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #a78bfa;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #3b82f6);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #upload-status {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }

    .success { color: #34d399; }
    .error { color: #f87171; }
    .loading { color: #60a5fa; }

    .chat-box {
      background: #12121f;
      border-radius: 12px;
      padding: 16px;
      height: 300px;
      overflow-y: auto;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: #3b3b5c; border-radius: 4px; }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .message.user {
      background: linear-gradient(90deg, #7c3aed, #3b82f6);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      background: #1e1e35;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #2d2d44;
    }

    .message.bot .result-item {
      padding: 6px 0;
      border-bottom: 1px solid #2d2d44;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .message.bot .result-item:last-child { border-bottom: none; }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background: #12121f;
      border: 1px solid #2d2d44;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: #7c3aed; }

    .send-btn {
      width: auto;
      padding: 12px 20px;
      margin-top: 0;
      border-radius: 10px;
      font-size: 1.1rem;
    }

    .empty-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b3b5c;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>🤖 RAG Chatbot</h1>
  <p class="subtitle">Upload a PDF and ask questions about it</p>

  <!-- Upload Card -->
  <div class="card">
    <h2>📄 Upload PDF</h2>
    <div class="upload-area" onclick="document.getElementById('pdf-input').click()">
      <div class="icon">📁</div>
      <p>Click to select a PDF file</p>
      <input type="file" id="pdf-input" accept=".pdf" onchange="handleFileSelect(event)" />
    </div>
    <div id="file-name"></div>
    <button id="upload-btn" onclick="uploadPDF()" disabled>Upload & Process</button>
    <div id="upload-status"></div>
  </div>

  <!-- Query Card -->
  <div class="card">
    <h2>💬 Ask a Question</h2>
    <div class="chat-box" id="chat-box">
      <div class="empty-chat" id="empty-msg">Upload a PDF first, then ask questions...</div>
    </div>
    <div class="input-row">
      <input type="text" id="query-input" placeholder="Ask something about the PDF..." onkeydown="if(event.key==='Enter') sendQuery()" />
      <button class="send-btn" onclick="sendQuery()">➤</button>
    </div>
  </div>

  <script>
    const API = "http://localhost:8000";
    let selectedFile = null;

    function handleFileSelect(event) {
      selectedFile = event.target.files[0];
      if (selectedFile) {
        document.getElementById("file-name").textContent = `✅ ${selectedFile.name}`;
        document.getElementById("upload-btn").disabled = false;
        document.getElementById("upload-status").textContent = "";
      }
    }

    async function uploadPDF() {
      if (!selectedFile) return;

      const btn = document.getElementById("upload-btn");
      const status = document.getElementById("upload-status");

      btn.disabled = true;
      status.className = "loading";
      status.textContent = "⏳ Processing PDF...";

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const res = await fetch(`${API}/upload`, { method: "POST", body: formData });
        const data = await res.json();
        status.className = "success";
        status.textContent = `✅ ${data.message}`;
        document.getElementById("empty-msg") && (document.getElementById("empty-msg").style.display = "none");
      } catch (err) {
        status.className = "error";
        status.textContent = "❌ Upload failed. Is the server running?";
        btn.disabled = false;
      }
    }

    async function sendQuery() {
      const input = document.getElementById("query-input");
      const query = input.value.trim();
      if (!query) return;

      const chatBox = document.getElementById("chat-box");
      const emptyMsg = document.getElementById("empty-msg");
      if (emptyMsg) emptyMsg.style.display = "none";

      // User message
      chatBox.innerHTML += `<div class="message user">${query}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      // Loading
      const loadingId = "loading-" + Date.now();
      chatBox.innerHTML += `<div class="message bot" id="${loadingId}">⏳ Thinking...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(`${API}/query?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        const results = data.results || [];
        const content = results.length
          ? results.map((r, i) => `<div class="result-item"><b>Result ${i + 1}:</b> ${r}</div>`).join("")
          : "<div class='result-item'>No results found.</div>";

        document.getElementById(loadingId).innerHTML = content;
      } catch (err) {
        document.getElementById(loadingId).innerHTML = "❌ Query failed. Is the server running?";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
